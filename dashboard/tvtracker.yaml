# TV Tracker dashboard.
# Add via: Settings > Dashboards > Add dashboard > (open it) > ⋮ > Raw configuration editor,
# then paste this file's contents.
# The room names below must match your rooms in the TV Tracker options.
title: TV Tracker
views:
  - title: Watching
    path: watching
    icon: mdi:television-play
    cards:
      # Shown only when a viewing is waiting for you: matched by searching Trakt ("probably"),
      # or an episode title that fits several shows (numbered options). The buttons act on
      # the FIRST one listed; "Ask me later" moves it to the back.
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.tv_tracker_needs_confirming
            above: 0
        card:
          type: vertical-stack
          cards:
            - type: markdown
              title: Is this right?
              content: |-
                {% for m in state_attr('sensor.tv_tracker_needs_confirming', 'matches') or [] -%}
                {% if m.candidates -%}
                - **“{{ m.title }}”** fits {{ m.candidates | length }} shows · {{ m.service or '?' }}{% if m.room %}, {{ m.room }}{% endif %}
                {% for c in m.candidates %}   {{ loop.index }}. **{{ c.show }}**{% if c.year %} ({{ c.year }}){% endif %} S{{ c.season }}E{{ c.episode }}{% if c.hint %} — {{ c.hint }}{% endif %}
                {% endfor -%}
                {% else -%}
                - **{{ m.title }}** S{{ m.season }}E{{ m.episode }}{% if m.episode_title %} — “{{ m.episode_title }}”{% endif %} *(probably)* · {{ m.service or '?' }}{% if m.room %}, {{ m.room }}{% endif %}
                {% endif -%}
                {% endfor %}
                The buttons act on the **first** one.
            - type: conditional
              conditions:
                - condition: numeric_state
                  entity: sensor.tv_tracker_needs_confirming
                  attribute: choice_count
                  below: 1
              card:
                type: button
                name: Yes, that's right
                icon: mdi:check-circle-outline
                tap_action:
                  action: perform-action
                  perform_action: tvtracker.confirm_match
                  data:
                    id: latest
            - type: conditional
              conditions:
                - condition: numeric_state
                  entity: sensor.tv_tracker_needs_confirming
                  attribute: choice_count
                  above: 0
              card:
                type: button
                name: Choose 1
                icon: mdi:numeric-1-circle-outline
                tap_action:
                  action: perform-action
                  perform_action: tvtracker.pick_match
                  data: {id: latest, choice: 1}
            - type: conditional
              conditions:
                - condition: numeric_state
                  entity: sensor.tv_tracker_needs_confirming
                  attribute: choice_count
                  above: 1
              card:
                type: button
                name: Choose 2
                icon: mdi:numeric-2-circle-outline
                tap_action:
                  action: perform-action
                  perform_action: tvtracker.pick_match
                  data: {id: latest, choice: 2}
            - type: conditional
              conditions:
                - condition: numeric_state
                  entity: sensor.tv_tracker_needs_confirming
                  attribute: choice_count
                  above: 2
              card:
                type: button
                name: Choose 3
                icon: mdi:numeric-3-circle-outline
                tap_action:
                  action: perform-action
                  perform_action: tvtracker.pick_match
                  data: {id: latest, choice: 3}
            - type: conditional
              conditions:
                - condition: numeric_state
                  entity: sensor.tv_tracker_needs_confirming
                  attribute: choice_count
                  above: 3
              card:
                type: button
                name: Choose 4
                icon: mdi:numeric-4-circle-outline
                tap_action:
                  action: perform-action
                  perform_action: tvtracker.pick_match
                  data: {id: latest, choice: 4}
            - type: button
              name: None of these / not right
              icon: mdi:close-circle-outline
              tap_action:
                action: perform-action
                perform_action: tvtracker.dismiss_match
                data:
                  id: latest
            - type: conditional
              conditions:
                - condition: numeric_state
                  entity: sensor.tv_tracker_needs_confirming
                  above: 1
              card:
                type: button
                name: Ask me about this later
                icon: mdi:skip-next-circle-outline
                tap_action:
                  action: perform-action
                  perform_action: tvtracker.skip_match
                  data:
                    id: latest
            - type: entities
              title: Wrong show? Type the right one
              entities:
                - entity: text.tv_tracker_show_search
                  name: Show name
            - type: button
              name: Use the show I typed
              icon: mdi:swap-horizontal
              tap_action:
                action: perform-action
                perform_action: tvtracker.assign_match
                data:
                  id: latest
      - type: markdown
        title: Now watching
        content: |-
          {% for room in ['Family Room', 'Bedroom', 'Living Room'] -%}
          {% set e = 'sensor.tv_tracker_now_watching_' ~ (room | lower | replace(' ', '_')) -%}
          {% if states(e) in ['Idle', 'unknown', 'unavailable'] -%}
          **{{ room }}** — off
          {% else -%}
          **{{ room }}** — {{ states(e) }} ({{ state_attr(e, 'service') }}{% if state_attr(e, 'channel') %}, {{ state_attr(e, 'channel') }}{% endif %})
          {% endif %}
          {% endfor %}

      # Up next, in three groups. "on ..." is the service you've watched it on, else
      # where TMDB says it streams.
      - type: markdown
        title: Up next — available to watch
        content: |-
          {% set rows = (state_attr('sensor.tv_tracker_continue_watching', 'items') or []) | selectattr('type', 'eq', 'tv') | selectattr('group', 'eq', 'available') | list -%}
          {% if rows | length == 0 -%}
          Nothing waiting.
          {% endif -%}
          {% for v in rows -%}
          - **{{ v.title }}** — next **{{ v.next }}** · {% if v.watched_on %}on {{ v.watched_on | join(', ') }}{% else %}{{ v.availability }}{% endif %}
          {% endfor %}
      - type: markdown
        title: Up next — coming soon
        content: |-
          {% set rows = (state_attr('sensor.tv_tracker_continue_watching', 'items') or []) | selectattr('type', 'eq', 'tv') | selectattr('group', 'eq', 'coming_soon') | list -%}
          {% if rows | length == 0 -%}
          Nothing scheduled.
          {% endif -%}
          {% for v in (rows | selectattr('expected') | sort(attribute='expected') | list) + (rows | rejectattr('expected') | sort(attribute='title') | list) -%}
          {% set a = v.announced_season -%}
          - **{{ v.title }}** — {% if v.next_air_date %}{{ as_timestamp(v.next_air_date) | timestamp_custom('%a %d %b %Y') }}{% elif a and a.air_date %}season {{ a.season }} from {{ as_timestamp(a.air_date) | timestamp_custom('%d %b %Y') }}{% else %}season {{ a.season }} announced, no date yet{% endif %} · {% if v.watched_on %}on {{ v.watched_on | join(', ') }}{% else %}{{ v.availability }}{% endif %}
          {% endfor %}
      - type: markdown
        title: Up next — finished
        content: |-
          {% set rows = (state_attr('sensor.tv_tracker_continue_watching', 'items') or []) | selectattr('type', 'eq', 'tv') | selectattr('group', 'eq', 'finished') | list -%}
          {% if rows | length == 0 -%}
          Nothing finished lately.
          {% endif -%}
          {% for v in rows -%}
          - **{{ v.title }}** — {{ 'ended' if v.status == 'finished' else 'all caught up, no new episodes announced' }}{% if v.progress %} (last {{ v.progress }}){% endif %}
          {% endfor %}

  - title: Catch up
    path: catch-up
    icon: mdi:playlist-check
    cards:
      # Lists the shows watched where only the title was seen (so the episode is unknown),
      # then shows with a new episode out (perhaps watched where we couldn't see it).
      # Choose one, then the last episode you've watched: everything up to it is marked
      # watched here and added to Trakt (only what Trakt hasn't got).
      - type: entities
        title: Where are you up to?
        entities:
          - entity: select.tv_tracker_pick_show
            name: Show
          - entity: select.tv_tracker_watched_up_to
            name: Last episode watched
          - entity: button.tv_tracker_mark_watched_up_to
            name: Mark watched up to here
      - type: markdown
        title: Unwatched episodes
        content: |-
          {% set e = 'select.tv_tracker_watched_up_to' -%}
          {% if not state_attr(e, 'show') -%}
          {% if (state_attr('select.tv_tracker_pick_show', 'options') or []) | length > 1 -%}
          Choose a show above: first those watched where we don't know which episode you're up to, then those with a new episode out.
          {% else -%}
          Nothing to catch up on.
          {% endif -%}
          {% elif state_attr(e, 'loading') -%}
          Loading episodes…
          {% elif state_attr(e, 'count') == 0 -%}
          **{{ state_attr(e, 'show') }}**: you're up to date.
          {% else -%}
          **{{ state_attr(e, 'show') }}** — {{ state_attr(e, 'count') }} not watched yet:
          {% for ep in state_attr(e, 'episodes') -%}
          - {{ ep.label }}{% if ep.air_date %} ({{ as_timestamp(ep.air_date) | timestamp_custom('%d %b %Y') }}){% endif %}
          {% endfor %}
          {% endif %}

  - title: Watchlists
    path: watchlists
    icon: mdi:playlist-play
    cards:
      # Things you've finished (a film you've watched, a show that has ended and you've
      # seen all of, including what Trakt says you've watched) are left off.
      - type: entities
        entities:
          - entity: select.tv_tracker_watchlist
            name: List
          - entity: select.tv_tracker_genre
            name: Genre
      - type: markdown
        title: Watchlists
        content: |-
          {% set lists = state_attr('sensor.tv_tracker_watchlists', 'lists') or {} -%}
          {% set genre = state_attr('sensor.tv_tracker_watchlists', 'genre') -%}
          {% if lists | length == 0 -%}
          No watchlists yet. Ask Claude to create one, or call `tvtracker.create_list`.
          {% endif -%}
          {% for name, items in lists.items() -%}
          ### {{ name }}
          {% if items | length == 0 -%}
          {{ 'Nothing in ' ~ genre ~ '.' if genre else 'Nothing left to watch.' }}
          {% endif -%}
          {% for v in items -%}
          - **{{ v.title }}** ({{ 'TV' if v.type == 'tv' else 'Movie' }}{% if v.year %}, {{ v.year }}{% endif %}) — {{ v.status | replace('_', ' ') }}{% if v.progress %}, at {{ v.progress }}{% endif %}{% if v.next and v.status == 'want_to_watch' %}, start {{ v.next }}{% endif %} — {{ v.availability }}{% if v.genres %} · *{{ v.genres | join(', ') }}*{% endif %}
          {% endfor %}

          {% endfor %}

  - title: TV & Movies
    path: history
    icon: mdi:history
    cards:
      - type: markdown
        title: Recently watched
        content: |-
          {% for h in state_attr('sensor.tv_tracker_history', 'tv_movies') or [] -%}
          - **{{ h.title or 'Unknown' }}**{% if h.season %} S{{ h.season }}E{{ h.episode }}{% endif %}{% if h.probable %} *(probably)*{% endif %} — {{ h.service or '?' }}{% if h.room %}, {{ h.room }}{% endif %} · {{ as_timestamp(h.start) | timestamp_custom('%a %d %b %H:%M') }}
          {% endfor %}

  - title: YouTube
    path: youtube
    icon: mdi:youtube
    cards:
      - type: markdown
        title: Recently watched
        content: |-
          {% for h in state_attr('sensor.tv_tracker_history', 'youtube') or [] -%}
          - **{{ h.title or 'Unknown video' }}**{% if h.channel %} — {{ h.channel }}{% endif %}{% if h.room %} ({{ h.room }}){% endif %} · {{ as_timestamp(h.start) | timestamp_custom('%a %d %b %H:%M') }}
          {% endfor %}

  - title: Services
    path: services
    icon: mdi:play-network
    cards:
      - type: markdown
        title: My streaming services
        content: |-
          {% for s in state_attr('sensor.tv_tracker_services', 'services') or [] -%}
          - {{ s }}
          {% endfor %}
